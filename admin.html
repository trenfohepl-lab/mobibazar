<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Store Admin Panel</title>
<style>
:root{--bg:#050816;--card:#0c1226;--line:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--c1:#06b6d4;--c2:#10b981;--red:#ef4444;--amb:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding:14px}
header{position:sticky;top:0;z-index:20;background:rgba(5,8,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;padding-bottom:10px}
h1{font-size:17px;margin:0}
h1 span{background:linear-gradient(90deg,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:960px;margin:0 auto}
.tab{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#0b1020;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#06b6d4,#10b981);color:#021016;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px}.stat small{color:var(--mut);font-weight:600}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#1e293b}
.btn.pri{background:linear-gradient(135deg,#06b6d4,#10b981);color:#021016}
.btn.red{background:rgba(239,68,68,.15);color:#fca5a5}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
input,select,textarea{width:100%;background:#070b1a;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid .full{grid-column:1/-1}
@media(min-width:700px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.pitem{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pitem .info{min-width:0;flex:1 1 220px}
.pitem .nm{font-weight:800;font-size:15px}
.pitem .sub{font-size:12px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px}
.b-in{background:rgba(16,185,129,.15);color:#6ee7b7}.b-out{background:rgba(239,68,68,.15);color:#fca5a5}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal .box{background:#0a0f20;border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:18px}
@media(min-width:700px){#modal{align-items:center}#modal .box{border-radius:20px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#0c1226;border:1px solid #334155;padding:10px 18px;border-radius:99px;font-size:14px;transition:.3s;z-index:90;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:360px}
.note{font-size:12px;color:var(--mut);line-height:1.5}
.warn{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.07)}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx)}
#loader{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:95;background:#0c1226;border:1px solid #334155;border-radius:14px;padding:12px 16px;min-width:260px;font-size:13px;box-shadow:0 10px 30px #0008}
#loader .bar{height:6px;border-radius:9px;background:#1e293b;margin-top:8px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#06b6d4,#10b981);transition:width .15s}
.spin{width:14px;height:14px;border:2px solid #334155;border-top-color:#22d3ee;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="card">
    <h1 style="margin-bottom:6px">Store <span>Admin</span></h1>
    <p class="note" style="margin:0 0 16px">Enter your administrator email and password to access the store management dashboard.</p>
    <label>Admin Email</label>
    <input id="em" type="email" placeholder="admin@mobibazar.com" autocomplete="username" style="margin-bottom:10px">
    <label>Password</label>
    <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn pri" style="width:100%;margin-top:14px" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header>
    <div class="wrap">
      <h1 id="topStoreTitle">Store <span>Admin</span></h1>
      <div class="row">
        <a class="btn sm" href="index.html" target="_blank" style="text-decoration:none;color:inherit">Storefront ↗</a>
        <button class="btn sm" onclick="logout()">Sign Out</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<div id="modal" class="hide" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="loader" class="hide"><div class="row"><span class="spin"></span><span id="lTxt">Uploading…</span></div><div class="bar"><i id="lBar"></i></div></div>

<script>
/* ===== CLOUD CONFIGURATION ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAUJGlDUuFc0_PiQi4OwLKGq2VevLo3rI0",
  authDomain: "mobile-shop-bb3ee.firebaseapp.com",
  databaseURL: "https://mobile-shop-bb3ee-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mobile-shop-bb3ee",
  storageBucket: "mobile-shop-bb3ee.firebasestorage.app",
  messagingSenderId: "234370721702",
  appId: "1:234370721702:android:8fe98d90e590f8242a9167"
};
const STORE_ID = "mobibazar";
const CLOUDINARY_CLOUD_NAME = "xtzxhfrp";
const CLOUDINARY_UPLOAD_PRESET = "mobibazar_preset";

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const base = firebase.database().ref(`stores/${STORE_ID}`);

const DEF_STORE = {
  name: 'Mobibazar Store',
  whatsapp: '919831182202',
  phone: '+919831182202',
  shortAddress: 'Main Counter',
  address: 'Shop Counter, Main Market',
  openHour: 10, closeHour: 21,
  hoursText: 'Open Daily: 10:00 AM - 9:00 PM',
  customers: '5,000+', rating: '4.9', since: '2020',
  offer: ''
};

const $ = s => document.querySelector(s);
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CONDS = ['Mint','Superb','Good','Fair'];
const DEF_BRANDS = ['Apple','OnePlus','Samsung','Vivo','Realme','Xiaomi','Oppo','Google Pixel','Nothing','Motorola'];
const STATUSES = ['Booked','Visiting','Sold','Cancelled'];
const STCOL = {Booked:'#f59e0b',Visiting:'#06b6d4',Sold:'#10b981',Cancelled:'#ef4444'};
const PAYS = ['Cash','UPI','Card','EMI'];

let tab = 'phones', q = '', curPhotos = [], curVideo = '', synced = false, upN = 0;
let DB = { STORE: structuredClone(DEF_STORE), PHONES: [], CATS: [], ORDERS: [] };
const arr = v => v ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v)) : [];
const byId = a => Object.fromEntries(a.map(x => [x.id, x]));

function norm(d){
  d.PHONES.forEach(p => { if(p.photos) p.photos = arr(p.photos); });
  d.ORDERS.forEach(o => { if(o.log) o.log = arr(o.log); });
  if(!d.CATS.length) d.CATS = [...new Set([...DEF_BRANDS, ...d.PHONES.map(p=>p.brand)])].map(n => ({name:n, show:true, img:''}));
  return d;
}

function save(msg){
  const d = JSON.parse(JSON.stringify({ store:DB.STORE, phones:byId(DB.PHONES), cats:DB.CATS, orders:byId(DB.ORDERS) }));
  const e = o => Object.keys(o).length ? o : null;
  base.update({ store:d.store, phones:e(d.phones), cats:d.cats.length ? d.cats : null, orders:e(d.orders) })
    .then(() => toast(msg || 'Saved to cloud ✓'))
    .catch(err => toast('Save error: ' + err.message));
}

function onSnap(snap){
  const v = snap.val() || {};
  if(!v.store && !v.phones){
    synced = true; DB = norm({ STORE:structuredClone(DEF_STORE), PHONES:[], CATS:[], ORDERS:[] });
    save('Store initialized in cloud'); render(); return;
  }
  DB = norm({ STORE:Object.assign(structuredClone(DEF_STORE), v.store || {}), PHONES:arr(v.phones), CATS:arr(v.cats), ORDERS:arr(v.orders) });
  synced = true;
  $('#topStoreTitle').innerHTML = `${esc(DB.STORE.name || 'Store')} <span>Admin</span>`;
  const ae = document.activeElement;
  const busy = !$('#modal').classList.contains('hide') || (ae && $('#main').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName));
  if(!busy) render();
}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* Authentication */
function doLogin(){
  const em = $('#em').value.trim(), pw = $('#pw').value;
  if(!em || !pw) return toast('Please enter admin email and password.');
  auth.signInWithEmailAndPassword(em, pw).catch(e => toast('Login failed: ' + (e.message || e.code)));
}
function logout(){ auth.signOut(); }
$('#pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

let listening = false;
auth.onAuthStateChanged(u => {
  if(u){
    $('#login').classList.add('hide'); $('#app').classList.remove('hide'); render();
    if(!listening){ listening = true; base.on('value', onSnap, err => toast('Database error: ' + err.message)); }
  } else {
    if(listening){ base.off('value'); listening = false; }
    synced = false; $('#app').classList.add('hide'); $('#login').classList.remove('hide');
  }
});

/* Tabs */
const TABS = [['phones','📱 Inventory'],['cats','🗂️ Categories'],['orders','🧾 Bookings & Orders'],['store','🏪 Store Profile'],['settings','⚙️ Settings']];
function render(){
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  $('#main').innerHTML = !synced ? '<div class="card note"><span class="spin"></span> Connecting to real-time database…</div>'
    : ({phones:vPhones, cats:vCats, orders:vOrders, store:vStore, settings:vSettings})[tab]();
}

/* =====================================================
   PHONES TAB
   ===================================================== */
function vPhones(){
  const P = DB.PHONES, inS = P.filter(p=>p.stock);
  const val = inS.reduce((a,p)=>a+Number(p.price||0),0);
  const list = P.filter(p => (p.name+' '+p.brand+' '+(p.color||'')).toLowerCase().includes(q.toLowerCase()));
  return `
  <div class="stats">
    <div class="stat"><b>${P.length}</b><small>Total Models</small></div>
    <div class="stat"><b style="color:#6ee7b7">${inS.length}</b><small>In Stock</small></div>
    <div class="stat"><b style="color:#fca5a5">${P.length-inS.length}</b><small>Sold Out</small></div>
    <div class="stat"><b>${inr(val)}</b><small>Stock Value</small></div>
  </div>
  <div class="row" style="margin-bottom:14px">
    <input style="flex:1 1 180px" placeholder="Search phone model, brand or color..." value="${esc(q)}" oninput="q=this.value;renderList()">
    <button class="btn pri" onclick="editPhone()">+ Add New Phone</button>
  </div>
  <div id="plist">${listHTML(list)}</div>`;
}

function listHTML(list){
  if(!list.length) return '<div class="card note">No smartphones in inventory. Tap "+ Add New Phone" to get started.</div>';
  return list.map(p => `
  <div class="card pitem">
    <div class="info">
      <div class="nm">
        ${p.photos?.length ? `<img src="${p.photos[0]}" style="width:34px;height:34px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">` : ''}
        ${esc(p.name)}
        ${p.video?'<span class="badge b-in"><i class="fa-solid fa-play"></i> 20s Video</span>':''}
        <span class="badge ${p.stock?'b-in':'b-out'}">${p.stock?'IN STOCK ('+(p.left||1)+')':'SOLD OUT'}</span>
      </div>
      <div class="sub">${esc(p.brand)} · ${p.ram}GB / ${p.storage}GB · 🔋 ${p.battery}% · ${esc(p.condition||'Verified')} · <b style="color:#e2e8f0">${inr(p.price)}</b> ${p.mrp ? `<s>${inr(p.mrp)}</s>` : ''}</div>
    </div>
    <div class="row">
      <button class="btn sm" onclick="toggleStock(${p.id})">${p.stock?'Mark Sold Out':'Restock'}</button>
      <button class="btn sm" onclick="editPhone(${p.id})">Edit</button>
      <button class="btn sm" onclick="dupPhone(${p.id})">Duplicate</button>
      <button class="btn sm red" onclick="delPhone(${p.id})">Delete</button>
    </div>
  </div>`).join('');
}

function renderList(){
  const list = DB.PHONES.filter(p => (p.name+' '+p.brand+' '+(p.color||'')).toLowerCase().includes(q.toLowerCase()));
  $('#plist').innerHTML = listHTML(list);
}

const nextId = () => Math.max(0, ...DB.PHONES.map(p=>p.id)) + 1;

function toggleStock(id){
  const p = DB.PHONES.find(x=>x.id===id); if(!p) return;
  p.stock = !p.stock;
  p.left = p.stock ? (p.left>0 ? p.left : 1) : 0;
  save(p.stock ? 'Phone marked In Stock' : 'Phone marked Sold Out'); render();
}

function dupPhone(id){
  const c = structuredClone(DB.PHONES.find(x=>x.id===id)); c.id = nextId(); c.name += ' (Copy)';
  DB.PHONES.push(c); save('Phone duplicated'); render();
}

function delPhone(id){
  const p = DB.PHONES.find(x=>x.id===id);
  if(confirm(`Are you sure you want to delete "${p.name}"?`)){
    DB.PHONES = DB.PHONES.filter(x=>x.id!==id);
    save('Phone deleted'); render();
  }
}

/* Edit / Add Phone Modal (Clean & Simple) */
function editPhone(id){
  const p = id ? DB.PHONES.find(x=>x.id===id) : {
    brand:'Apple', name:'', color:'', ram:8, storage:128, battery:90, condition:'Mint', score:'10/10',
    price:0, mrp:0, box:'Full Box + Fast Charger', flagship:false, stock:true, left:1, tag:'',
    os:'iOS', age:'1 Year Old', warranty:'7-Day Testing Warranty', defectNote:''
  };
  const brands = [...new Set([...DB.CATS.map(c=>c.name), ...DB.PHONES.map(x=>x.brand)])];
  const f = (l,id,v,t='text',x='') => `<div><label>${l}</label><input id="f_${id}" type="${t}" value="${esc(v)}" ${x}></div>`;
  const sel = (l,id,arr,v) => `<div><label>${l}</label><select id="f_${id}">${arr.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;

  $('#modalBox').innerHTML = `
  <div class="row between" style="margin-bottom:12px">
    <h1 style="font-size:18px">${id ? 'Edit Smartphone' : 'Add New Smartphone'}</h1>
    <button class="btn sm" onclick="closeModal()">✕</button>
  </div>
  <div class="grid g3">
    <div><label>Brand</label><input id="f_brand" list="brandList" value="${esc(p.brand)}"><datalist id="brandList">${brands.map(b=>`<option value="${esc(b)}">`).join('')}</datalist></div>
    ${f('Model Name','name',p.name,'text','placeholder="e.g. iPhone 14 Pro"')}
    ${f('Color','color',p.color,'text','placeholder="e.g. Deep Purple"')}
    ${f('RAM (GB)','ram',p.ram,'number')}
    ${f('Storage (GB)','storage',p.storage,'number')}
    ${f('Battery Health %','battery',p.battery,'number')}
    ${sel('Condition Grade','condition',CONDS,p.condition)}
    ${f('Condition Score','score',p.score || '10/10')}
    ${sel('Operating System','os',['iOS','Android'],p.os)}
    ${f('Selling Price ₹','price',p.price,'number')}
    ${f('Original MRP ₹','mrp',p.mrp,'number')}
    ${f('Available Quantity','left',p.left,'number')}
    <div class="full">${f('Box & Included Accessories','box',p.box,'text','placeholder="e.g. Full Box + Original Cable"')}</div>
    ${f('Phone Age / Usage','age',p.age,'text','placeholder="e.g. 8 months used"')}
    ${f('Warranty Offered','warranty',p.warranty,'text','placeholder="e.g. 7-Day Testing Warranty"')}
    ${f('Promotion Tag','tag',p.tag,'text','placeholder="e.g. Hot Deal, Best Seller"')}
    <div class="full">${f('Condition Note / Remarks (Optional)','defectNote',p.defectNote || '','text','placeholder="e.g. Minor hairline scratch on edge, screen 100% spotless"')}</div>
    <div class="tog"><input type="checkbox" id="f_stock" ${p.stock?'checked':''}> In Stock</div>
    <div class="tog"><input type="checkbox" id="f_flagship" ${p.flagship?'checked':''}> Flagship Deal</div>
    
    <div class="full">
      <label>📷 Phone Photos (Max 4 Photos — Auto-compressed)</label>
      <div id="photoBox" class="row" style="margin-bottom:8px"></div>
      <label class="btn sm" style="display:inline-block;cursor:pointer">+ Add Photos<input type="file" accept="image/*" multiple class="hide" onchange="addPhotos(this.files);this.value=''"></label>
    </div>

    <div class="full">
      <label>🎬 20-Second Testing Video (Max 20s & Max 20MB)</label>
      <div id="videoBox" class="row" style="margin-bottom:8px"></div>
      <label class="btn sm" style="display:inline-block;cursor:pointer">+ Upload Video<input type="file" accept="video/*" class="hide" onchange="addVideo(this.files[0]);this.value=''"></label>
      <div class="note" style="margin-top:4px">Upload a clip under 20 seconds and under 20MB demonstrating phone display, cameras, and body condition.</div>
    </div>
  </div>

  <div class="row" style="margin-top:16px;justify-content:flex-end">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="savePhone(${id||0})">Save Smartphone</button>
  </div>`;

  curPhotos = [...(p.photos || [])];
  curVideo = p.video || '';
  renderPhotos();
  renderVideo();
  $('#modal').classList.remove('hide');
}

function closeModal(){ $('#modal').classList.add('hide'); }

function savePhone(id){
  const g = k => $('#f_'+k).value.trim(), n = k => Number(g(k)) || 0;
  if(upN > 0){ toast('Upload in progress. Please wait…'); return; }
  if(!g('name')){ toast('Model name is required.'); return; }
  if(n('price') <= 0){ toast('Please enter a valid selling price.'); return; }

  const o = {
    id: id || nextId(), brand:g('brand'), name:g('name'), color:g('color'),
    ram:n('ram'), storage:n('storage'), battery:n('battery'),
    condition:g('condition'), score:g('score'), price:n('price'), mrp:n('mrp') || n('price'),
    box:g('box'), flagship:$('#f_flagship').checked, stock:$('#f_stock').checked,
    left:n('left'), tag:g('tag'), os:g('os'), age:g('age'), warranty:g('warranty'),
    defectNote:g('defectNote')
  };
  if(!o.stock) o.left = 0; else if(o.left < 1) o.left = 1;
  if(curPhotos.length) o.photos = [...curPhotos];
  if(curVideo) o.video = curVideo;

  if(id){
    const i = DB.PHONES.findIndex(x=>x.id===id);
    DB.PHONES[i] = o;
  } else {
    DB.PHONES.push(o);
  }

  closeModal();
  save(id ? 'Smartphone updated' : 'Smartphone added');
  render();
}

/* =====================================================
   MEDIA UPLOADER WITH 20MB & 20S STRICT LIMIT
   ===================================================== */
function startUp(t){ upN++; $('#loader').classList.remove('hide'); setUp(0, t); }
function setUp(p, t){ if(t) $('#lTxt').textContent = t; $('#lBar').style.width = p + '%'; }
function endUp(){ upN = Math.max(0, upN-1); if(!upN) $('#loader').classList.add('hide'); }

function compress(file, M = 800){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, M / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => {
        if(b && b.type === 'image/webp') return res(b);
        c.toBlob(j => j ? res(j) : rej(new Error('Compression failed')), 'image/jpeg', 0.72);
      }, 'image/webp', 0.72);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Cannot read image')); };
    img.src = url;
  });
}

function cloudUpload(blob, kind, label){
  return new Promise((res, rej) => {
    const fd = new FormData();
    fd.append('file', blob);
    fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const x = new XMLHttpRequest();
    x.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${kind}/upload`);
    x.upload.onprogress = e => { if(e.lengthComputable) setUp(Math.round(e.loaded/e.total*100), `${label} ${Math.round(e.loaded/e.total*100)}%`); };
    x.onload = () => {
      let j = {}; try{ j = JSON.parse(x.responseText); }catch(e){}
      if(x.status >= 200 && x.status < 300 && j.secure_url) res(j.secure_url);
      else rej(new Error((j.error && j.error.message) || ('HTTP ' + x.status)));
    };
    x.onerror = () => rej(new Error('Network error'));
    x.send(fd);
  });
}

async function addPhotos(files){
  for(const f of [...files]){
    if(curPhotos.length >= 4){ toast('Maximum 4 photos allowed.'); break; }
    if(!f.type.startsWith('image/')) continue;
    startUp('Compressing photo…');
    try{
      const b = await compress(f);
      curPhotos.push(await cloudUpload(b, 'image', 'Photo upload'));
      renderPhotos();
    } catch(e){
      toast('Photo upload failed: ' + (e.message || ''));
    }
    endUp();
  }
}

function renderPhotos(){
  const b = $('#photoBox'); if(!b) return;
  b.innerHTML = curPhotos.length ? curPhotos.map((s,i) => `
    <div style="position:relative">
      <img src="${s}" style="width:76px;height:76px;object-fit:cover;border-radius:10px;border:2px solid ${i===0?'#10b981':'#1e293b'}">
      <button class="btn sm red" style="position:absolute;top:-6px;right:-6px;padding:2px 7px" onclick="rmPhoto(${i})">✕</button>
      ${i===0 ? '<small style="position:absolute;bottom:3px;left:4px;background:#10b981;color:#021016;border-radius:6px;padding:0 5px;font-size:10px;font-weight:800">MAIN</small>'
               : `<button class="btn sm" style="position:absolute;bottom:3px;left:3px;padding:1px 6px;font-size:10px" onclick="mainPhoto(${i})">Main</button>`}
    </div>`).join('') : '<span class="note">No photos uploaded yet.</span>';
}
function rmPhoto(i){ curPhotos.splice(i,1); renderPhotos(); }
function mainPhoto(i){ const [s] = curPhotos.splice(i,1); curPhotos.unshift(s); renderPhotos(); }

function vidDuration(file){
  return new Promise((res, rej) => {
    const v = document.createElement('video'), u = URL.createObjectURL(file);
    v.preload = 'metadata'; v.muted = true;
    v.onloadedmetadata = () => { const d = v.duration; URL.revokeObjectURL(u); res(d); };
    v.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Cannot read video')); };
    v.src = u;
  });
}

/* 20MB & 20s Strict Checks */
async function addVideo(f){
  if(!f) return;
  if(!f.type.startsWith('video/')) return toast('Please select a valid video file.');

  // 1. File size check (Max 20MB)
  const MAX_SIZE = 20 * 1024 * 1024;
  if(f.size > MAX_SIZE){
    alert(`Video file size exceeds the 20MB limit!

Your file: ${(f.size / (1024*1024)).toFixed(1)} MB
Maximum allowed: 20 MB

Please select or compress a smaller video clip.`);
    return;
  }

  // 2. Video duration check (Max 20 seconds)
  let d;
  try{
    d = await vidDuration(f);
  } catch(e){
    return toast(e.message);
  }

  if(d > 20.5){
    alert(`Video duration exceeds the 20-second limit!

Your video: ${Math.round(d)} seconds
Maximum allowed: 20 seconds

Please select or record a clip under 20 seconds.`);
    return;
  }

  startUp('Uploading video…');
  try{
    curVideo = await cloudUpload(f, 'video', 'Video upload');
    renderVideo();
    toast('Video uploaded successfully ✓');
  } catch(e){
    toast('Video upload failed: ' + (e.message || ''));
  }
  endUp();
}

function renderVideo(){
  const b = $('#videoBox'); if(!b) return;
  b.innerHTML = curVideo ? `
    <div class="row">
      <video src="${curVideo}" controls muted playsinline preload="metadata" style="width:120px;height:120px;object-fit:cover;border-radius:10px;border:2px solid #10b981;background:#000"></video>
      <button class="btn sm red" onclick="curVideo='';renderVideo()">Remove Video</button>
    </div>` : '<span class="note">No video uploaded yet.</span>';
}

function vCats(){
  const C = DB.CATS;
  return `
  <div class="card">
    <b>Add Brand Category</b>
    <div class="row" style="margin-top:8px">
      <input id="newCat" style="flex:1 1 180px" placeholder="Brand name (e.g. Google Pixel)">

    </div>
    <p class="note" style="margin-top:8px">These categories appear as filter pills on your customer storefront. Reorder using ↑ ↓ buttons.</p>
  </div>
  ${C.length ? C.map((c,i) => {
    const n = DB.PHONES.filter(p => p.brand === c.name).length;
    return `<div class="card pitem">
      <div class="info">
        <div class="nm">
          ${c.img ? `<img src="${c.img}" style="width:30px;height:30px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:6px">` : ''}
          ${esc(c.name)}
          <span class="badge ${c.show!==false?'b-in':'b-out'}">${c.show!==false?'VISIBLE':'HIDDEN'}</span>
        </div>
        <div class="sub">${n} device${n!==1?'s':''}</div>
      </div>
      <div class="row">
        <button class="btn sm" onclick="moveCat(${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="btn sm" onclick="moveCat(${i},1)" ${i===C.length-1?'disabled':''}>↓</button>
        <button class="btn sm" onclick="toggleCat(${i})">${c.show!==false?'Hide':'Show'}</button>
        <label class="btn sm" style="cursor:pointer">🖼 Icon<input type="file" accept="image/*" class="hide" onchange="catImg(${i},this.files[0]);this.value=''"></label>
        ${c.img ? `<button class="btn sm" onclick="rmCatImg(${i})">Remove Icon</button>` : ''}
        <button class="btn sm" onclick="renameCat(${i})">Rename</button>
        <button class="btn sm red" onclick="delCat(${i})">Delete</button>
      </div>
    </div>`;
  }).join('') : '<div class="card note">No brand categories found.</div>'}`;
}

function addCat(){
  const n = $('#newCat').value.trim();
  if(!n) return toast('Please enter brand name');
  if(DB.CATS.some(c => c.name.toLowerCase() === n.toLowerCase())) return toast('Category already exists');
  DB.CATS.push({name:n, show:true, img:''}); save('Category added'); render();
}
function moveCat(i,d){ const j=i+d; if(j<0||j>=DB.CATS.length) return; [DB.CATS[i],DB.CATS[j]]=[DB.CATS[j],DB.CATS[i]]; save('Order updated'); render(); }
function toggleCat(i){ DB.CATS[i].show = DB.CATS[i].show === false; save(DB.CATS[i].show ? 'Category visible' : 'Category hidden'); render(); }
function renameCat(i){
  const old = DB.CATS[i].name, n = (prompt('New brand name', old)||'').trim();
  if(!n || n===old) return;
  DB.CATS[i].name = n; DB.PHONES.forEach(p => { if(p.brand===old) p.brand = n; });
  save('Category renamed'); render();
}
function delCat(i){
  const c = DB.CATS[i];
  if(confirm(`Delete category "${c.name}"?`)){ DB.CATS.splice(i,1); save('Category deleted'); render(); }
}
async function catImg(i,f){
  if(!f) return;
  startUp('Uploading icon…');
  try{ const b = await compress(f, 120); DB.CATS[i].img = await cloudUpload(b, 'image', 'Icon upload'); save('Icon updated'); render(); }
  catch(e){ toast('Icon upload failed: ' + (e.message||'')); }
  endUp();
}
function rmCatImg(i){ DB.CATS[i].img = ''; save('Icon removed'); render(); }

/* =====================================================
   BOOKINGS & ORDERS TAB
   ===================================================== */
let ofilter = 'All', oq = '';
const fdt = t => new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const nextOid = () => Math.max(0, ...DB.ORDERS.map(o=>o.id)) + 1;

function vOrders(){
  const O = DB.ORDERS, cnt = s => O.filter(o=>o.status===s).length;
  const rev = O.filter(o=>o.status==='Sold').reduce((a,o)=>a+Number(o.price||0),0);
  return `
  <div class="stats">
    <div class="stat"><b>${O.length}</b><small>Total Leads</small></div>
    <div class="stat"><b style="color:#fbbf24">${cnt('Booked')+cnt('Visiting')}</b><small>Active Follow-ups</small></div>
    <div class="stat"><b style="color:#6ee7b7">${cnt('Sold')}</b><small>Completed Sales</small></div>
    <div class="stat"><b>${inr(rev)}</b><small>Total Revenue</small></div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <input style="flex:1 1 180px" placeholder="Search customer name or phone..." value="${esc(oq)}" oninput="oq=this.value;renderOList()">
    <button class="btn pri" onclick="editOrder()">+ Add Booking</button>
  </div>
  <div class="row" style="margin-bottom:12px">${['All',...STATUSES].map(s => `<button class="tab ${ofilter===s?'on':''}" onclick="ofilter='${s}';render()">${s}${s==='All'?'':' · '+cnt(s)}</button>`).join('')}</div>
  <div id="olist">${oListHTML()}</div>`;
}

function oListHTML(){
  const t = oq.toLowerCase();
  const list = DB.ORDERS.filter(o => (ofilter==='All' || o.status===ofilter) && (`${o.customer} ${o.mobile} ${o.phoneName}`).toLowerCase().includes(t)).sort((a,b)=>b.created-a.created);
  if(!list.length) return '<div class="card note">No booking records found.</div>';
  return list.map(o => `
    <div class="card">
      <div class="row between">
        <div class="nm">${esc(o.customer||'Customer')} <span class="badge" style="background:${STCOL[o.status]}22;color:${STCOL[o.status]}">${o.status.toUpperCase()}</span></div>
        <div class="sub">Booking #${o.id} · ${fdt(o.created)}</div>
      </div>
      <div class="sub" style="margin-top:6px">📱 <b style="color:#e2e8f0">${esc(o.phoneName)}</b> · ${inr(o.price)} · ${esc(o.pay||'Cash')} ${o.mobile?'· 📞 '+esc(o.mobile):''}</div>
      ${o.note ? `<div class="sub" style="margin-top:4px">📝 ${esc(o.note)}</div>` : ''}
      <div class="row" style="margin-top:12px">
        <select style="width:auto" onchange="setOStatus(${o.id},this.value)">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
        ${o.mobile ? `<a class="btn sm" style="text-decoration:none;color:inherit" target="_blank" href="https://wa.me/${String(o.mobile).replace(/\D/g,'')}">Chat on WhatsApp</a>` : ''}
        <button class="btn sm" onclick="editOrder(${o.id})">Edit</button>
        <button class="btn sm red" onclick="delOrder(${o.id})">Delete</button>
      </div>
    </div>`).join('');
}

function renderOList(){ const e = $('#olist'); if(e) e.innerHTML = oListHTML(); }

function applyStock(o, s){
  const p = DB.PHONES.find(x=>x.id===o.phoneId); if(!p) return;
  if(s==='Sold' && !o.adj){ p.left = Math.max(0,(p.left||0)-1); if(p.left===0) p.stock = false; o.adj = true; }
  else if(s!=='Sold' && o.adj){ p.left = (p.left||0)+1; p.stock = true; o.adj = false; }
}

function setOStatus(id,s){
  const o = DB.ORDERS.find(x=>x.id===id); if(!o || o.status===s) return;
  o.status = s; (o.log = o.log||[]).push({s, t:Date.now()}); applyStock(o,s);
  save('Order status updated'); render();
}

function delOrder(id){
  const o = DB.ORDERS.find(x=>x.id===id);
  if(confirm(`Delete booking record #${id}?`)){
    applyStock(o,'Cancelled');
    DB.ORDERS = DB.ORDERS.filter(x=>x.id!==id);
    save('Booking deleted'); render();
  }
}

function editOrder(id){
  const o = id ? DB.ORDERS.find(x=>x.id===id) : {customer:'',mobile:'',phoneId:'',price:0,pay:'Cash',status:'Booked',note:''};
  const ph = [...DB.PHONES].sort((a,b)=>b.stock-a.stock);
  $('#modalBox').innerHTML = `
  <div class="row between" style="margin-bottom:12px"><h1>${id?'Edit Booking #'+id:'New Customer Booking'}</h1><button class="btn sm" onclick="closeModal()">✕</button></div>
  <div class="grid">
    <div><label>Customer Name</label><input id="o_customer" value="${esc(o.customer)}"></div>
    <div><label>Customer Mobile</label><input id="o_mobile" type="tel" value="${esc(o.mobile)}"></div>
    <div class="full"><label>Selected Phone</label><select id="o_phone" onchange="const p=DB.PHONES.find(x=>x.id===+this.value);if(p)$('#o_price').value=p.price"><option value="">— Select device —</option>${ph.map(p=>`<option value="${p.id}" ${p.id===o.phoneId?'selected':''}>${esc(p.name)} (${p.ram}/${p.storage}) · ${inr(p.price)}${p.stock?'':' · SOLD OUT'}</option>`).join('')}</select></div>
    <div><label>Final Agreed Price ₹</label><input id="o_price" type="number" value="${o.price}"></div>
    <div><label>Payment Method</label><select id="o_pay">${PAYS.map(s=>`<option ${s===o.pay?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><label>Status</label><select id="o_status">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="full"><label>Notes</label><input id="o_note" value="${esc(o.note)}" placeholder="e.g. Visiting today at 5 PM, trade-in discussion"></div>
  </div>
  <div class="row" style="margin-top:16px;justify-content:flex-end">
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn pri" onclick="saveOrder(${id||0})">Save Booking</button>
  </div>`;
  $('#modal').classList.remove('hide');
}

function saveOrder(id){
  const p = DB.PHONES.find(x=>x.id===Number($('#o_phone').value));
  if(!p) return toast('Please select a smartphone');
  const v = k => $('#o_'+k).value.trim(), st = v('status');
  if(id){
    const o = DB.ORDERS.find(x=>x.id===id);
    if(o.adj && o.phoneId!==p.id) applyStock(o,'Cancelled');
    Object.assign(o, {customer:v('customer'), mobile:v('mobile'), phoneId:p.id, phoneName:p.name, price:Number(v('price'))||p.price, pay:v('pay'), note:v('note')});
    if(o.status!==st){ o.status = st; (o.log=o.log||[]).push({s:st,t:Date.now()}); }
    applyStock(o, st);
  } else {
    const o = {id:nextOid(), created:Date.now(), customer:v('customer'), mobile:v('mobile'), phoneId:p.id, phoneName:p.name, price:Number(v('price'))||p.price, pay:v('pay'), status:st, note:v('note'), log:[{s:st,t:Date.now()}], adj:false};
    DB.ORDERS.push(o); applyStock(o, st);
  }
  closeModal(); save(id?'Booking updated':'Booking added'); render();
}
